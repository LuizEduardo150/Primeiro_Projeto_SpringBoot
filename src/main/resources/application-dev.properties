springdoc.api-docs.path=/api-docs

spring.jpa.open-in-view=false

spring.datasource.url=jdbc:postgresql://localhost:5432/produto
spring.datasource.username=postgres
spring.datasource.password=root

#__ Criar tabelas no database
#spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialectj


# essas linhas são habilitadas somente uma vez, afim de gerar o arquivo com o SQL.#spring.jpa.properties.jakarta.persistence.schema-generation.create-source=metadata
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=create.sql
#spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
#spring.datasource.dialect=org.hibernate.dialect.MySQLDialect


#createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&useTimezone=true&serverTimezone=UTC

flyway.schemas=produto
flyway.baseline-version=0
flyway.baseline-on-migrate=true
flyway.out-of-order=true
flyway.locations=classpath:db/migration
flyway.sql-migration-prefix=V
flyway.validate-on-migrate=true
flyway.enabled=true
flyway.fail-on-missing-locations=true
flyway.repair=true